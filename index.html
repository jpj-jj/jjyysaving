<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>กระปุกบ้านเรา</title>
<meta name="theme-color" content="#F7F0E4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="กระปุกบ้านเรา">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F0E4; --card:#FFFBF5; --ink:#4A3A2E; --muted:#8C7B6B; --line:#EADFCC;
  --terra:#C9774E; --terra-d:#A95D38; --terra-s:#F4DDCD;
  --sage:#7C9265; --sage-d:#5F7449; --sage-s:#E2E9D5;
  --honey:#D9A441; --honey-d:#B9862A; --honey-s:#F7E7C2;
  --rose:#D4705F; --shadow:0 6px 18px rgba(110,80,50,.10); --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:15px}
body{min-height:100vh;background:radial-gradient(circle at 10% 0%,#FBF3E3 0,transparent 40%),radial-gradient(circle at 100% 30%,#F2E9D8 0,transparent 35%),var(--bg)}
h1,h2,h3,.num,.brand{font-family:'Mali',cursive;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea{font:inherit;color:var(--ink)}
.app{max-width:560px;margin:0 auto;padding:0 16px calc(100px + env(safe-area-inset-bottom))}
.muted{color:var(--muted)} .small{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px} .row-sb{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;border:1px solid rgba(234,223,204,.7)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.sec{display:flex;align-items:center;gap:6px;font-size:16px;margin:20px 0 10px}

/* icons */
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic .fl{fill:var(--icfill,rgba(217,164,65,.28))}
.ic .hf{fill:var(--rose);stroke:none} .ic .dot{fill:currentColor;stroke:none} .ic .blush{fill:#E9A38F;stroke:none}

/* header */
header.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 6px}
.brand{display:flex;align-items:center;gap:6px;font-size:17px;color:var(--sage-d);--icfill:var(--sage-s)}
.sync{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--card);box-shadow:var(--shadow)}
.sync.spin .ic{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* avatar */
.av{border-radius:50%;display:inline-grid;place-items:center;overflow:hidden;flex:none;font-family:'Mali';font-weight:700;color:#fff;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(110,80,50,.15)}
.av img{width:100%;height:100%;object-fit:cover}
.av-terra{background:linear-gradient(135deg,#E0A07C,var(--terra))} .av-sage{background:linear-gradient(135deg,#A9BB92,var(--sage))} .av-honey{background:linear-gradient(135deg,#EBC77A,var(--honey))}

/* home */
.hello{display:flex;align-items:center;gap:12px;margin:8px 0 14px}
.hello h2{font-size:22px}
.hello .yearsw{margin-left:auto}
.yearsw{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--shadow);font-family:'Mali';font-weight:600;white-space:nowrap}
.yearsw button{width:28px;height:28px;border-radius:50%;font-size:18px;line-height:1;color:var(--terra)}
.yearsw button:active{background:var(--terra-s)}
.yearsw span{padding:0 4px;font-size:14px}
.hero{position:relative;overflow:hidden;background:linear-gradient(150deg,#FFF8EC,#F8E6CC)}
.hero-ic{position:absolute;right:-8px;top:-6px;opacity:.9;--icfill:var(--honey-s);color:var(--honey-d)}
.hero-ic .ic{width:92px;height:92px;stroke-width:1.2}
.num.big{font-size:36px;font-weight:700;color:var(--terra-d);margin:4px 0 10px}
.num.mid{font-size:22px;font-weight:700;margin:10px 0 8px}
.bar{height:12px;border-radius:99px;background:rgba(201,119,78,.14);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--honey),var(--terra));min-width:4px;transition:width .6s}
.bar.thin{height:8px}
.hero .row-sb{margin-top:8px}
.mcard{text-align:left;display:block;width:100%}
.mc-terra .num{color:var(--terra-d)} .mc-sage .num{color:var(--sage-d)}
.mc-sage .bar{background:rgba(124,146,101,.16)} .mc-sage .bar i{background:linear-gradient(90deg,#A9BB92,var(--sage))}
.mcard:active,.li:active,.who:active{transform:scale(.98)}
.list{padding:6px}
.li{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px;border-radius:14px}
.li+.li{border-top:1px dashed var(--line)}
.li-b{flex:1;min-width:0}
.li-b .muted{font-size:13px}
.amt{font-weight:700;color:var(--sage-d);white-space:nowrap}
.empty{text-align:center;padding:24px 16px;color:var(--muted);--icfill:var(--sage-s)}
.empty .ic{width:56px;height:56px;color:var(--sage);stroke-width:1.4}

/* buttons, chips */
.btn{background:var(--terra);color:#fff;border-radius:14px;padding:11px 18px;font-weight:600;box-shadow:0 3px 0 var(--terra-d);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--terra-d)}
.btn:disabled{opacity:.6}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:12px}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 0 0 1.5px var(--line) inset}
.btn.danger{color:var(--rose)}
.btn.full{width:100%;margin-top:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 13px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-size:13.5px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* piggy */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-weight:600;font-size:14px}
.pill .av{border-width:1.5px}
.pill.on{border-color:var(--terra);background:var(--terra-s)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats div{display:flex;flex-direction:column}
.stats b{font-size:18px}
.stats .bar{grid-column:1/-1;margin-top:4px}
.stats.c-sage b{color:var(--sage-d)} .stats.c-terra b{color:var(--terra-d)}
.stats.c-sage .bar i{background:linear-gradient(90deg,#A9BB92,var(--sage))}
.helper{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;padding:12px 14px;--icfill:var(--honey-s)}
.helper label{white-space:nowrap;display:flex;align-items:center;gap:6px;flex:1;min-width:200px}
.helper input{width:90px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-family:'Mali';font-size:16px}
.note{background:var(--honey-s);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px;padding-bottom:80px}
.cell{aspect-ratio:1;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-family:'Mali';font-weight:600;font-size:14px;position:relative;transition:transform .12s}
.cell.done{background:var(--terra);border-color:var(--terra);color:#fff}
.cells.c-sage .cell.done{background:var(--sage);border-color:var(--sage)}
.cell.done::after{content:'';position:absolute;right:4px;top:4px;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.75)}
.cell.sel{background:var(--honey);border-color:var(--honey-d);color:#fff;transform:scale(1.07);box-shadow:0 3px 8px rgba(185,134,42,.35)}
.fab{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translate(-50%,160%);opacity:0;pointer-events:none;width:min(528px,calc(100% - 24px));background:var(--ink);color:#fff;border-radius:18px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:8px;transition:transform .25s;z-index:20;box-shadow:0 10px 24px rgba(74,58,46,.3)}
.fab.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.fab>div{flex:1;display:flex;flex-direction:column;font-size:13px}
.fab .num{font-size:18px;color:var(--honey-s)}
.fab .btn.ghost{background:transparent;color:#fff;box-shadow:0 0 0 1.5px rgba(255,255,255,.3) inset}

/* modal */
#modal{position:fixed;inset:0;z-index:50;display:none}
#modal.open{display:block}
.mbg{position:absolute;inset:0;background:rgba(74,58,46,.4);animation:fade .2s}
.sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .25s}
.sheet h3{display:flex;align-items:center;gap:8px;font-size:19px;margin-bottom:12px;--icfill:var(--honey-s)}
@keyframes up{from{transform:translate(-50%,40%);opacity:.4}} @keyframes fade{from{opacity:0}}
.daychips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.daychips span{background:var(--honey-s);color:var(--honey-d);font-family:'Mali';font-weight:700;padding:4px 10px;border-radius:10px}
.sum{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border-radius:14px;padding:10px 14px;margin-bottom:12px}
.sum b{font-size:22px;color:var(--terra-d)}
.f{display:block;margin-bottom:12px;font-weight:500;font-size:14px}
.f em{color:var(--rose);font-style:normal;font-size:12px}
.f input:not([type=file]){display:block;width:100%;margin-top:6px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff}
.upload{position:relative;margin-top:6px;border:2px dashed var(--line);border-radius:16px;min-height:110px;display:grid;place-items:center;background:#FFFDF9;overflow:hidden;--icfill:var(--terra-s);color:var(--terra)}
.upload.has{border-style:solid;border-color:var(--sage)}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:2}
.upload #slipPrev{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;padding:14px}
.upload #slipPrev .ic{width:36px;height:36px}
.upload img{max-height:260px;max-width:100%;border-radius:10px}
.mact{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
.mact .btn{flex:1}
.slip{margin-top:10px;text-align:center;background:var(--bg);border-radius:16px;padding:10px;min-height:80px;display:grid;place-items:center}
.slip img{max-width:100%;max-height:55vh;border-radius:10px}
.noteq{background:var(--sage-s);border-radius:12px;padding:8px 12px;margin:6px 0 0}
.bigamt{margin-left:auto;font-size:22px}

/* chat */
.chathead{display:flex;align-items:center;gap:10px;padding:12px 14px;margin:6px 0 10px}
.msgs{display:flex;flex-direction:column;gap:8px;padding-bottom:140px}
.dsep{align-self:center;font-size:12px;color:var(--muted);background:rgba(234,223,204,.6);padding:3px 10px;border-radius:99px;margin:8px 0 2px}
.msg{display:flex;align-items:flex-end;gap:6px;max-width:82%}
.msg.me{align-self:flex-end}
.bub{padding:9px 13px;border-radius:18px 18px 18px 6px;background:var(--card);box-shadow:var(--shadow);line-height:1.45;word-break:break-word}
.msg.me .bub{background:var(--terra);color:#fff;border-radius:18px 18px 6px 18px}
.bub .t{display:block;font-size:10.5px;opacity:.65;margin-top:3px;text-align:right}
.msg.pending{opacity:.6}
.cwrap{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom));z-index:15;background:linear-gradient(transparent,var(--bg) 30%)}
.cwrap-in{max-width:560px;margin:0 auto;padding:14px 16px 8px}
.composer{display:flex;gap:8px}
.composer input{flex:1;padding:12px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);outline:none}
.composer input:focus{border-color:var(--terra)}
.send{width:46px;height:46px;border-radius:50%;background:var(--terra);color:#fff;display:grid;place-items:center;--icfill:rgba(255,255,255,.3)}

/* profile */
.prof{text-align:center;padding:24px 16px}
.pav{position:relative;display:inline-block}
.camb{position:absolute;right:0;bottom:2px;width:36px;height:36px;border-radius:50%;background:var(--terra);color:#fff;display:grid;place-items:center;cursor:pointer;border:3px solid var(--card);--icfill:rgba(255,255,255,.25)}
.camb .ic{width:18px;height:18px}
.nameedit{display:flex;gap:8px;justify-content:center;margin:14px 0 10px}
.nameedit input{width:160px;text-align:center;padding:8px 10px;border-radius:12px;border:1.5px solid var(--line);font-family:'Mali';font-weight:700;font-size:18px;background:#fff}
.gap{justify-content:center;gap:8px}
.stc{display:flex;flex-direction:column;gap:2px;--icfill:var(--honey-s);color:var(--ink)}
.stc .ic{color:var(--honey-d);margin-bottom:4px}
.stc b{font-size:20px;color:var(--terra-d)}
.set h3{display:flex;align-items:center;gap:6px;font-size:16px;margin-bottom:8px}
.set input{width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:13px;margin:8px 0}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px;border-radius:99px}
.badge.ok{background:var(--sage-s);color:var(--sage-d)} .badge.demo{background:var(--honey-s);color:var(--honey-d)}

/* today */
.today{margin-top:12px;background:linear-gradient(150deg,#F3F6EC,#E2E9D5);--icfill:#fff;color:var(--ink)}
.today .row{margin-bottom:6px}
.today .ic{color:var(--sage-d)}
.today .dnum{font-size:40px;font-weight:700;color:var(--sage-d);line-height:1.1}
.today .bar{background:rgba(124,146,101,.18);margin:10px 0 6px}
.today .bar i{background:linear-gradient(90deg,#A9BB92,var(--sage))}
.tstat{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed rgba(95,116,73,.3);font-size:14px}
.tstat b{color:var(--sage-d)}

.tstrip{display:flex;align-items:center;gap:10px;background:var(--sage-s);border-radius:16px;padding:10px 14px;margin:0 0 12px;--icfill:#fff;color:var(--ink);font-size:14px}
.tstrip .ic{color:var(--sage-d)}
.tstrip b{font-family:'Mali';color:var(--sage-d);font-size:17px}
.tstrip .tr{margin-left:auto;text-align:right;white-space:nowrap}
.tcell{margin-top:6px;font-size:12.5px;padding:3px 8px;border-radius:8px;display:inline-block;background:var(--bg)}
.tcell.ok{background:var(--sage-s);color:var(--sage-d)}
.ver{text-align:center;font-size:11px;color:var(--muted);margin-top:14px}

/* welcome */
.welcome{text-align:center;padding-top:12vh}
.wic{color:var(--terra);--icfill:var(--honey-s)} .wic .ic{width:90px;height:90px;stroke-width:1.3}
.welcome h1{font-size:30px;color:var(--terra-d);margin:8px 0 4px}
.who{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 10px}
.who b{font-family:'Mali';font-size:17px}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(110,80,50,.06)}
#nav:empty{display:none}
.nv{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);padding:4px 0;--icfill:transparent}
.ni{position:relative;width:48px;height:32px;border-radius:14px;display:grid;place-items:center;transition:background .2s}
.nv.on{color:var(--terra-d);font-weight:600;--icfill:rgba(201,119,78,.22)}
.nv.on .ni{background:var(--terra-s)}
.ni em{position:absolute;top:-2px;right:4px;background:var(--rose);color:#fff;font-style:normal;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--card)}

#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-150%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;z-index:60;transition:transform .3s;font-size:14px;max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
.coinfx{position:fixed;bottom:-30px;font-size:28px;z-index:70;pointer-events:none;animation:rise 1.8s ease-out forwards}
@keyframes rise{to{transform:translateY(-75vh) rotate(200deg);opacity:0}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="fab" class="fab"></div>
<nav id="nav"></nav>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ====== ตั้งค่า ======
   วาง URL ของ Web App จาก Google Apps Script (ลงท้ายด้วย /exec) ไว้ในเครื่องหมายคำพูดด้านล่าง
   (ถ้า repo เป็นสาธารณะ ให้เว้นว่างไว้ แล้วไปวาง URL ในหน้าโปรไฟล์ของแต่ละเครื่องแทน) — ถ้าเว้นว่างไว้ เว็บจะทำงานแบบ "โหมดทดลอง" เก็บข้อมูลในเครื่องเท่านั้น */
const API_URL = '';
const APP_VER = '1.2 (28 ก.ย. 69)';

const DEFAULT_MEMBERS = [{id:'joopjang',name:'JOOPJANG',avatarId:''},{id:'yaya',name:'YAYA',avatarId:''}];
const MEMBER_COLOR = {joopjang:'terra', yaya:'sage'};
const TH_MONTH = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const QUICK = ['หยอดกระปุกแล้วนะ 🐷','เก่งมาก 👏','สู้ ๆ นะ 💪','วันนี้ลืมหยอด 😅','ครบเป้าเมื่อไหร่ไปเที่ยวกัน ✈️'];

const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }
};

const S = {
  me: LS.get('kp_me', null),
  api: LS.get('kp_api','') || API_URL,
  data: LS.get('kp_data', null) || {members:DEFAULT_MEMBERS, savings:[], messages:[]},
  year: new Date().getFullYear(),
  tab: 'home', view: null, sel: new Set(), filter: 'all', range: 'all',
  syncing: false, slip: null, have: '', json: '', msgN: -1
};
S.json = JSON.stringify(S.data);

/* ====== icons ====== */
const svg = s => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${s}</svg>`;
const IC = {
  home: svg('<path class="fl" d="M4 11l8-6.5 8 6.5V19a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19z"/><path class="hf" d="M12 17.6s-3-1.8-3-3.6a1.5 1.5 0 0 1 3-.7 1.5 1.5 0 0 1 3 .7c0 1.8-3 3.6-3 3.6z"/>'),

/* ====== helpers ====== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n||0).toLocaleString('th-TH');
const daysIn = y => new Date(y,1,29).getDate() === 29 ? 366 : 365;
const target = y => { const n = daysIn(y); return n*(n+1)/2; };
const be = y => y + 543;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,'0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
function thDate(s){ if(!s) return ''; const d = new Date(String(s).length <= 10 ? s+'T00:00:00' : s); if(isNaN(d)) return esc(s); return `${d.getDate()} ${TH_MONTH[d.getMonth()]} ${String(d.getFullYear()+543).slice(-2)}`; }
function dayLabel(ms){ const d = new Date(ms); return `${d.getDate()} ${TH_MONTH[d.getMonth()]} ${d.getFullYear()+543}`; }
const hhmm = ms => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const daysOf = r => String(r.days).split(',').map(Number).filter(n => n > 0);
const sumArr = a => a.reduce((x,y) => x+y, 0);
function member(id){ return S.data.members.find(m => m.id === id) || {id, name:id, avatarId:''}; }
function other(){ return S.data.members.find(m => m.id !== S.me); }
function recs(mid,y){ return S.data.savings.filter(r => r.member === mid && Number(r.year) === y); }
function dayMap(mid,y){ const m = new Map(); recs(mid,y).forEach(r => daysOf(r).forEach(d => m.set(d,r))); return m; }
function stat(mid,y){ const map = dayMap(mid,y); let amt = 0; map.forEach((r,d) => amt += d); return {amt, cnt:map.size, map}; }
function imgUrl(id,w=800){ if(!id) return ''; id = String(id); if(id.startsWith('data:')) return id; return `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w${w}`; }
function fullUrl(id){ id = String(id||''); return id.startsWith('data:') ? id : `https://drive.google.com/file/d/${encodeURIComponent(id)}/view`; }
const unread = () => S.data.messages.filter(m => m.to === S.me && !m.readAt).length;
const col = id => MEMBER_COLOR[id] || 'honey';
function avatar(m,size=44){ const u = imgUrl(m.avatarId,400); return `<span class="av av-${col(m.id)}" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.42)}px">${u?`<img src="${u}" alt="" loading="lazy">`:esc((m.name||'?').charAt(0))}</span>`; }

let toastT;
function toast(t){ const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('show'), 2600); }
function celebrate(){ for(let i=0;i<14;i++){ const e = document.createElement('span'); e.className='coinfx'; e.textContent=['🪙','✨','🌼'][i%3]; e.style.left=(8+Math.random()*84)+'vw'; e.style.animationDelay=(Math.random()*.45)+'s'; document.body.appendChild(e); setTimeout(() => e.remove(), 2400); } }

/* ====== data / sync ====== */
function localAction(p){
  const d = JSON.parse(JSON.stringify(S.data)); const now = Date.now();
  if(p.action === 'addSaving'){
    const taken = new Set(); d.savings.filter(r => r.member===p.member && Number(r.year)===p.year).forEach(r => daysOf(r).forEach(x => taken.add(x)));
    const dup = p.days.filter(x => taken.has(x)); if(dup.length) throw new Error('ช่อง '+dup.join(', ')+' เก็บไปแล้ว');
    d.savings.push({id:uid(), member:p.member, year:p.year, days:p.days.join(','), date:p.date, slipId:`data:${p.slipMime};base64,${p.slipB64}`, note:p.note, createdAt:now});
  } else if(p.action === 'deleteSaving'){ d.savings = d.savings.filter(r => r.id !== p.id); }
  else if(p.action === 'updateProfile'){ const m = d.members.find(x => x.id === p.member); if(p.name != null) m.name = String(p.name).trim() || m.name; if(p.removeAvatar) m.avatarId=''; if(p.avatarB64) m.avatarId=`data:${p.avatarMime};base64,${p.avatarB64}`; }
  else if(p.action === 'sendMessage'){ d.messages = d.messages.filter(m => !m.pending); d.messages.push({id:uid(), from:p.from, to:p.to, text:p.text, createdAt:now, readAt:0}); }
  else if(p.action === 'markRead'){ d.messages.forEach(m => { if(m.to===p.member && !m.readAt) m.readAt = now; }); }
  return {ok:true, ...d};
}
async function call(p){
  if(!S.api) return localAction(p);
  const r = await fetch(S.api, {method:'POST', body:JSON.stringify(p)});
  const j = await r.json();
  if(!j.ok) throw new Error(j.error || 'เกิดข้อผิดพลาด');
  return j;
}
function setData(j){
  const d = {
    members: (j.members && j.members.length) ? j.members : DEFAULT_MEMBERS,
    savings: (j.savings||[]).map(r => ({...r, year:Number(r.year), createdAt:Number(r.createdAt)})),
    messages: (j.messages||[]).filter(m => !m.pending).map(m => ({...m, createdAt:Number(m.createdAt), readAt:Number(m.readAt)||0}))
  };
  const js = JSON.stringify(d); if(js === S.json) return;
  S.json = js; S.data = d;
  if(!LS.set('kp_data', d) && !S.api) toast('พื้นที่ในเครื่องเต็ม (โหมดทดลอง) — เชื่อม Google Sheet เพื่อเก็บถาวร');
  render();
}
function paintSync(){ const b = $('.sync'); if(b) b.classList.toggle('spin', S.syncing); }
async function load(silent){
  if(!S.api){ if(!silent) toast('โหมดทดลอง: ข้อมูลอยู่ในเครื่องนี้'); return; }
  if(S.syncing) return;
  S.syncing = true; paintSync();
  try{
    const r = await fetch(S.api + (S.api.includes('?')?'&':'?') + 'action=load', {cache:'no-store'});
    const j = await r.json(); if(!j.ok) throw new Error(j.error);
    setData(j);
    if(!silent) toast('อัปเดตข้อมูลล่าสุดแล้ว');
    if(S.tab === 'chat') markRead();
  }catch(e){ if(!silent) toast('ซิงก์ไม่สำเร็จ: ' + e.message); }
  finally{ S.syncing = false; paintSync(); }
}
async function markRead(){ if(!S.me || !unread()) return; try{ setData(await call({action:'markRead', member:S.me})); }catch(e){} }

function viewPiggy(){
  const y = S.year, N = daysIn(y), T = target(y);
  const mid = S.view || S.me, m = member(mid), edit = mid === S.me, st = stat(mid,y);
  let lo = 1, hi = N;

  let cells = '';
  for(let d=lo; d<=hi; d++){
    const done = st.map.has(d);
    if(S.filter==='open' && done) continue;

  }
  const ranges = [['all','ทุกช่อง']]; for(let a=1; a<=N; a+=100){ const b = Math.min(a+99,N); ranges.push([`${a}-${b}`, `${a}–${b}`]); }

  return `
  <section class="row-sb" style="margin:8px 0 4px;flex-wrap:wrap"><div class="tabs">${S.data.members.map(x => `<button class="pill ${x.id===mid?'on':''}" data-act="viewMember" data-v="${esc(x.id)}">${avatar(x,26)}${esc(x.name)}</button>`).join('')}</div>${yearSw()}</section>

function viewChat(){

function dayOfYear(d){ return Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate()) - new Date(d.getFullYear(),0,1)) / 86400000) + 1; }
const TH_DOW = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const TH_MONTH_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
function todayStrip(){
  const now = new Date(), y = now.getFullYear(), n = dayOfYear(now), N = daysIn(y);
  return `<section class="tstrip">${IC.calendar}<div>วัน${TH_DOW[now.getDay()]}ที่ ${now.getDate()} ${TH_MONTH[now.getMonth()]} ${be(y)}<div class="small muted">เหลืออีก ${N-n} วันจะครบปี</div></div><div class="tr">วันที่ <b>${n}</b><div class="small muted">จาก ${N} วัน</div></div></section>`;
}
function todayCell(mid){
  const now = new Date(), y = now.getFullYear(), n = dayOfYear(now);
  if(S.year !== y) return '';
  return dayMap(mid,y).has(n) ? `<span class="tcell ok">✓ ช่องวันนี้ (${n}) หยอดแล้ว</span>` : `<span class="tcell">ช่องวันนี้ (${n}) ยังว่าง</span>`;
}
function todayCard(){
  const now = new Date(), y = now.getFullYear(), n = dayOfYear(now), N = daysIn(y);
  const done = dayMap(S.me,y).has(n);
  return `<section class="card today">
    <div class="row">${IC.calendar}<span>วัน${TH_DOW[now.getDay()]}ที่ ${now.getDate()} ${TH_MONTH_FULL[now.getMonth()]} ${be(y)}</span></div>
    <div class="small muted">วันนี้เป็นวันที่</div>
    <div class="num dnum">${n} <span class="small muted">จาก ${N} วันของปี ${be(y)}</span></div>
    <div class="bar thin"><i style="width:${(n/N*100).toFixed(1)}%"></i></div>
    <div class="row-sb small muted"><span>ผ่านไป ${(n/N*100).toFixed(1)}%</span><span>เหลืออีก ${N-n} วัน</span></div>
    <div class="tstat">${done ? `<span>🌼 ช่อง <b>${n}</b> ของวันนี้ หยอดแล้ว</span>` : `<span>ช่อง <b>${n}</b> (฿${fmt(n)}) ยังว่างอยู่</span><button class="btn sm" data-act="todayCell" data-v="${n}">หยอดช่องนี้</button>`}</div>
  </section>`;
}

function viewProfile(){
  const m = member(S.me), y = S.year, s = stat(S.me,y), T = target(y);
  const all = S.data.savings.filter(r => r.member === S.me);
  const allDays = all.flatMap(daysOf);
  return `
  <section class="card prof">
    <div class="pav">${avatar(m,116)}<label class="camb" aria-label="เปลี่ยนรูปโปรไฟล์">${IC.camera}<input type="file" class="avInput" accept="image/*" hidden></label></div>
    <div class="nameedit"><input id="nameIn" value="${esc(m.name)}" maxlength="20" aria-label="ชื่อที่แสดง"><button class="btn sm ghost" data-act="saveName">บันทึก</button></div>
    <div class="row gap">
      <label class="btn sm">${m.avatarId?'เปลี่ยนรูป':'เพิ่มรูปโปรไฟล์'}<input type="file" class="avInput" accept="image/*" hidden></label>
      ${m.avatarId ? `<button class="btn sm ghost danger" data-act="removeAvatar">ลบรูป</button>` : ''}
    </div>
  </section>
  ${todayCard()}
  <div class="grid2">
    <div class="card stc">${IC.coin}<span class="small muted">ออมรวมทุกปี</span><b class="num">฿${fmt(sumArr(allDays))}</b></div>
    <div class="card stc">${IC.jar}<span class="small muted">ปี ${be(y)}</span><b class="num">${(s.amt/T*100).toFixed(1)}%</b></div>
    <div class="card stc">${IC.calendar}<span class="small muted">หยอดไปแล้ว</span><b class="num">${all.length} ครั้ง</b></div>
    <div class="card stc">${IC.star}<span class="small muted">ช่องใหญ่สุดที่เก็บ</span><b class="num">${allDays.length?Math.max(...allDays):'-'}</b></div>
  </div>
  <section class="card set">
    <h3>${IC.gear} การเชื่อมต่อข้อมูล</h3>
    ${S.api ? `<span class="badge ok">● เชื่อมต่อ Google Sheet แล้ว</span>` : `<span class="badge demo">● โหมดทดลอง — ข้อมูลอยู่ในเครื่องนี้เท่านั้น</span>`}
    <input id="apiIn" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(S.api)}">
    <div class="row"><button class="btn sm" data-act="saveApi">บันทึก &amp; ซิงก์</button></div>
  </section>
  <button class="btn ghost full" data-act="switchUser">สลับผู้ใช้</button>
  <div class="ver">เวอร์ชัน ${APP_VER}</div>`;
}

function nav(){
  const u = unread();
  return [['home','หน้าแรก',IC.home],['piggy','กระปุก',IC.pig],['chat','ข้อความ',IC.chat],['profile','โปรไฟล์',IC.user]]
    .map(([k,l,ic]) => `<button class="nv ${S.tab===k?'on':''}" data-act="tab" data-v="${k}"><span class="ni">${ic}${k==='chat'&&u?`<em>${u}</em>`:''}</span><span>${l}</span></button>`).join('');
}

function render(){
  const root = $('#app');
  if(!S.me){ root.innerHTML = viewWelcome(); $('#nav').innerHTML = ''; updateBar(); return; }
  const ci = $('#chatInput'); const keep = ci ? {v:ci.value, f:document.activeElement===ci} : null;
  const views = {home:viewHome, piggy:viewPiggy, chat:viewChat, profile:viewProfile};
  root.innerHTML = header() + views[S.tab]();
  $('#nav').innerHTML = nav();
  if(S.tab === 'chat'){
    const c = $('#chatInput'); if(keep && c){ c.value = keep.v; if(keep.f) c.focus(); }
    if(S.data.messages.length !== S.msgN){ S.msgN = S.data.messages.length; requestAnimationFrame(() => window.scrollTo(0, document.body.scrollHeight)); }
  }
  updateBar();
}
function updateBar(){
  const f = $('#fab');
  if(S.me && S.tab === 'piggy' && S.sel.size){
    const days = [...S.sel];
    f.innerHTML = `<div><b>เลือก ${days.length} ช่อง</b><span class="num">฿${fmt(sumArr(days))}</span></div><button class="btn ghost sm" data-act="clearSel">ล้าง</button><button class="btn sm" data-act="openSave">หยอดกระปุก</button>`;
    f.classList.add('show');
  } else f.classList.remove('show');
}

/* ====== modal ====== */
function modal(html){ const m = $('#modal'); m.innerHTML = `<div class="mbg" data-act="closeModal"></div><div class="sheet">${html}</div>`; m.classList.add('open'); }
function closeModal(){ const m = $('#modal'); m.classList.remove('open'); m.innerHTML = ''; S.slip = null; }

function openSave(){
  const days = [...S.sel].sort((a,b) => a-b);
  modal(`<h3>${IC.pig} หยอดกระปุก</h3>
  <div class="daychips">${days.map(d => `<span>ช่อง ${d}</span>`).join('')}</div>
  <div class="sum"><span>ยอดที่ต้องโอน</span><b class="num">฿${fmt(sumArr(days))}</b></div>
  <label class="f">วันที่โอน<input type="date" id="fDate" value="${todayISO()}"></label>
  <div class="f">สลิปโอนเงิน <em>* จำเป็น</em>
    <div class="upload" id="slipBox"><input type="file" id="fSlip" accept="image/*" aria-label="แนบสลิป"><div id="slipPrev">${IC.camera}<span>แตะเพื่อแนบรูปสลิป</span></div></div>
  </div>
  <label class="f">หมายเหตุ<input id="fNote" maxlength="100" placeholder="เช่น เงินทอนจากตลาด"></label>
  <div class="mact"><button class="btn ghost" data-act="closeModal">ยกเลิก</button><button class="btn" id="btnSave" data-act="doSave">บันทึกการออม</button></div>`);
}
function openRecord(id){
  const r = S.data.savings.find(x => x.id === id); if(!r) return;
  const m = member(r.member), ds = daysOf(r), u = imgUrl(r.slipId,1000);
  modal(`<div class="row">${avatar(m,42)}<div><b>${esc(m.name)}</b><div class="small muted">โอนวันที่ ${thDate(r.date)}</div></div><span class="num amt bigamt">฿${fmt(sumArr(ds))}</span></div>
  <div class="daychips">${ds.map(d => `<span>ช่อง ${d}</span>`).join('')}</div>
  ${r.note ? `<p class="noteq">“${esc(r.note)}”</p>` : ''}
  <div class="slip">${u ? `<a href="${fullUrl(r.slipId)}" target="_blank" rel="noopener"><img src="${u}" alt="สลิปโอนเงิน"></a>` : '<span class="muted">ไม่มีสลิป</span>'}</div>
  <div class="mact">${r.member===S.me ? `<button class="btn ghost danger" data-act="delRec" data-v="${esc(r.id)}">ยกเลิกรายการ</button>` : ''}<button class="btn" data-act="closeModal">ปิด</button></div>`);
}

/* ====== images ====== */
function loadImg(file){ return new Promise((res,rej) => { const url = URL.createObjectURL(file), img = new Image(); img.onload = () => { URL.revokeObjectURL(url); res(img); }; img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('เปิดรูปนี้ไม่ได้ ลองใช้ไฟล์ JPG/PNG')); }; img.src = url; }); }
function toJpeg(c,q){ const d = c.toDataURL('image/jpeg',q); return {dataUrl:d, b64:d.split(',')[1], mime:'image/jpeg'}; }
async function compress(file,max,q){ const img = await loadImg(file); const s = Math.min(1, max/Math.max(img.width,img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s); const x = c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height); return toJpeg(c,q); }
async function compressSquare(file,size){ const img = await loadImg(file); const m = Math.min(img.width,img.height); const c = document.createElement('canvas'); c.width = c.height = size; c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,size,size); return toJpeg(c,.85); }

/* ====== actions ====== */
async function sendMsg(t){
  const o = other();
  S.data.messages.push({id:'tmp'+uid(), from:S.me, to:o?o.id:'', text:t, createdAt:Date.now(), readAt:0, pending:true});
  S.json = ''; render();
  try{ setData(await call({action:'sendMessage', from:S.me, to:o?o.id:'', text:t})); }
  catch(e){ S.data.messages = S.data.messages.filter(m => !m.pending); S.json = ''; render(); toast('ส่งไม่สำเร็จ: ' + e.message); }
}
const ACT = {
  pick(v){ S.me = v; LS.set('kp_me', v); S.tab = 'home'; render(); load(true); },
  switchUser(){ S.me = null; LS.set('kp_me', null); S.sel.clear(); render(); },
  sync(){ load(false); },
  tab(v){ S.tab = v; if(v === 'piggy') S.view = S.me; S.sel.clear(); S.msgN = -1; render(); if(v !== 'chat') window.scrollTo(0,0); else markRead(); },
  viewMember(v){ S.view = v; S.tab = 'piggy'; S.sel.clear(); render(); window.scrollTo(0,0); },
  year(v){ S.year += Number(v); S.sel.clear(); render(); },
  filter(v){ S.filter = v; render(); },
  range(v){ S.range = v; render(); },
  cell(v,t){
    const d = Number(v), mid = S.view || S.me, r = dayMap(mid,S.year).get(d);
    if(r) return openRecord(r.id);
    if(mid !== S.me) return toast('กระปุกของคนอื่นดูได้อย่างเดียวนะ');
    S.sel.has(d) ? S.sel.delete(d) : S.sel.add(d); t.classList.toggle('sel'); updateBar();
  },
  helper(){
    const a = Math.floor(Number($('#haveAmt').value)); if(!(a > 0)) return toast('ใส่จำนวนเงินก่อนนะ');
    S.have = a; const N = daysIn(S.year), taken = dayMap(S.me,S.year); S.sel.clear(); let rem = a;
    if(rem <= N && !taken.has(rem)){ S.sel.add(rem); rem = 0; }
    else for(let d = Math.min(N,rem); d >= 1 && rem > 0; d--){ if(!taken.has(d) && d <= rem){ S.sel.add(d); rem -= d; } }
    S.filter = 'all'; S.range = 'all'; render();
    if(!S.sel.size) return toast('ไม่มีช่องว่างที่ใช้เงินจำนวนนี้ได้');
    toast(rem > 0 ? `เลือกให้แล้ว เหลือเศษ ${rem} บาท` : `เลือกช่องที่พอดีกับ ${fmt(a)} บาทแล้ว`);
  },
  clearSel(){ S.sel.clear(); render(); },
  openSave(){ openSave(); },
  async doSave(){
    if(!S.slip) return toast('อย่าลืมแนบสลิปโอนเงินนะ');
    const btn = $('#btnSave'); btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
    const days = [...S.sel].sort((a,b) => a-b);
    try{
      const j = await call({action:'addSaving', member:S.me, year:S.year, days, date:$('#fDate').value || todayISO(), note:$('#fNote').value.trim(), slipB64:S.slip.b64, slipMime:S.slip.mime});
      S.sel.clear(); closeModal(); S.json = ''; setData(j); celebrate();
      const st = stat(S.me,S.year);
      toast(st.cnt === daysIn(S.year) ? `🎉 ครบทุกช่องของปี ${be(S.year)} แล้ว! เก่งที่สุด` : `หยอดกระปุกแล้ว +฿${fmt(sumArr(days))} 🐷`);
    }catch(e){ toast(e.message); btn.disabled = false; btn.textContent = 'บันทึกการออม'; }
  },
  todayCell(v){ S.year = new Date().getFullYear(); S.view = S.me; S.tab = 'piggy'; S.filter = 'all'; S.range = 'all'; S.sel.clear(); S.sel.add(Number(v)); render(); const c = document.querySelector(`.cell[data-v="${v}"]`); if(c) c.scrollIntoView({block:'center'}); },
  record(v){ openRecord(v); },
  async delRec(v){
    if(!confirm('ยกเลิกรายการนี้? ช่องจะกลับเป็นยังไม่เก็บ และสลิปจะถูกย้ายไปถังขยะ')) return;
    try{ const j = await call({action:'deleteSaving', id:v, member:S.me}); closeModal(); setData(j); toast('ยกเลิกรายการแล้ว'); }catch(e){ toast(e.message); }
  },
  closeModal(){ closeModal(); },
  quick(v){ sendMsg(v); },
  async saveName(){
    const n = $('#nameIn').value.trim(); if(!n) return toast('ชื่อว่างไม่ได้นะ');
    try{ setData(await call({action:'updateProfile', member:S.me, name:n})); toast('บันทึกชื่อแล้ว'); }catch(e){ toast(e.message); }
  },
  async removeAvatar(){
    if(!confirm('ลบรูปโปรไฟล์?')) return;
    try{ setData(await call({action:'updateProfile', member:S.me, removeAvatar:true})); toast('ลบรูปแล้ว'); }catch(e){ toast(e.message); }
  },
  saveApi(){
    const u = $('#apiIn').value.trim();
    if(u && !/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)) return toast('URL ต้องขึ้นต้นด้วย https://script.google.com และลงท้ายด้วย /exec');
    S.api = u; LS.set('kp_api', u); render();
    if(u) load(false); else toast('กลับเป็นโหมดทดลองแล้ว');
  }
};

document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if(!t) return; const f = ACT[t.dataset.act]; if(f){ e.preventDefault(); f(t.dataset.v, t, e); } });
document.addEventListener('submit', e => { if(e.target.id !== 'composer') return; e.preventDefault(); const i = $('#chatInput'); const t = i.value.trim(); if(!t) return; i.value = ''; sendMsg(t); });
document.addEventListener('change', async e => {
  const t = e.target;
  if(t.id === 'fSlip' && t.files[0]){
    try{ S.slip = await compress(t.files[0], S.api?1400:900, S.api?.82:.7); $('#slipPrev').innerHTML = `<img src="${S.slip.dataUrl}" alt="สลิป">`; $('#slipBox').classList.add('has'); }
    catch(err){ toast(err.message); }
  }
  if(t.classList.contains('avInput') && t.files[0]){
    try{ toast('กำลังอัปโหลดรูป...'); const im = await compressSquare(t.files[0],400); setData(await call({action:'updateProfile', member:S.me, avatarB64:im.b64, avatarMime:im.mime})); toast('เปลี่ยนรูปโปรไฟล์แล้ว'); }
    catch(err){ toast(err.message); }
    t.value = '';
  }
});

/* auto sync: ทุก 15 วิ ตอนเปิดหน้าข้อความ, ทุก 60 วิ หน้าอื่น, และทุกครั้งที่กลับมาเปิดแอป */
let tick = 0;
setInterval(() => { if(!S.api || !S.me || document.visibilityState !== 'visible') return; tick++; if(S.tab === 'chat' ? tick % 3 === 0 : tick % 12 === 0) load(true); }, 5000);
let lastDay = new Date().toDateString();
setInterval(() => { const d = new Date().toDateString(); if(d !== lastDay){ lastDay = d; if(S.me) render(); } }, 60000);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible'){ const d = new Date().toDateString(); if(d !== lastDay){ lastDay = d; if(S.me) render(); } load(true); } });

render();
if(S.me) load(true);
</script>
